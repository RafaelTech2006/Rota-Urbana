<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Chamados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
<div class="container">
    <h1 class="mt-5">Lista de Chamados</h1>

    <a href="/chamado/novo" class="btn btn-primary mb-3">Cadastrar Novo Chamado</a>

    <table class="table table-striped mt-3">
        <thead>
        <tr>
            <th>Código</th>
            <th>Título</th>
            <th>Descrição</th>
            <th>Prioridade</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="chamado : ${chamados}">
            <td th:text="${chamado.codigo}"></td>
            <td th:text="${chamado.titulo}"></td>
            <td th:text="${chamado.descricao}"></td>
            <td th:text="${chamado.prioridade}"></td>
            <td>
                <a th:href="@{/chamado/editar/{id}(id=${chamado.codigo})}" class="btn btn-warning btn-sm me-1">
                    <i class="bi bi-pencil-square"></i> Editar
                </a>
                <a th:href="@{/chamado/excluir/{id}(id=${chamado.codigo})}" class="btn btn-danger btn-sm"
                   onclick="return confirm('Tem certeza que deseja excluir?');">
                    <i class="bi bi-trash"></i> Excluir
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

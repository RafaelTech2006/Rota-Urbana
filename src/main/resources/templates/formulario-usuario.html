<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Cadastrar Utilizador</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
  <h1 class="mt-5">Registo de Utilizador</h1>
  <form th:action="${acao} == null ? '/usuario' : ${acao}" method="post">
    <div class="mb-3">
      <label for="nome" class="form-label">Nome</label>
      <input th:value="${acao} != null ? ${usuario.nome}" type="text" class="form-control" id="nome" name="nome" required>
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input th:value="${acao} != null ? ${usuario.email}" type="email" class="form-control" id="email" name="email" required>
    </div>
    <div class="mb-3">
      <label for="senha" class="form-label">Senha</label>
      <input type="password" class="form-control" id="senha" name="senha" required>
    </div>
    <div class="mb-3">
      <label for="telefone" class="form-label">Telefone</label>
      <input th:value="${acao} != null ? ${usuario.telefone}" type="text" class="form-control" id="telefone" name="telefone">
    </div>
    <div class="mb-3">
      <label for="cargo" class="form-label">Cargo</label>
      <input th:value="${acao} != null ? ${usuario.cargo}" type="text" class="form-control" id="cargo" name="cargo">
    </div>
    <button type="submit" class="btn btn-success">Salvar</button>
    <a href="/usuario" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
</body>
</html>

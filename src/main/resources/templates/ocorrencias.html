<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Lista de Ocorrências</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
<div class="container">
  <div class="d-flex justify-content-between align-items-center mt-5 mb-3">
    <h1>Lista de Ocorrências</h1>
    <a href="/" class="btn btn-outline-secondary">🏠 Voltar ao Início</a>
  </div>

  <a href="/ocorrencia/novo" class="btn btn-primary mb-3">Cadastrar Nova Ocorrência</a>

  <table class="table table-striped mt-3">
    <thead>
    <tr>
      <th>Código</th>
      <th>Título</th>
      <th>Descrição</th>
      <th>Status</th>
      <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="ocorrencia : ${ocorrencias}">
      <td th:text="${ocorrencia.codigo}"></td>
      <td th:text="${ocorrencia.titulo}"></td>
      <td th:text="${ocorrencia.descricao}"></td>
      <td th:text="${ocorrencia.status}"></td>
      <td>
        <a th:href="@{/ocorrencia/editar/{id}(id=${ocorrencia.codigo})}" class="btn btn-warning btn-sm me-1">
          <i class="bi bi-pencil-square"></i> Editar
        </a>
        <a th:href="@{/ocorrencia/excluir/{id}(id=${ocorrencia.codigo})}" class="btn btn-danger btn-sm"
           onclick="return confirm('Tem certeza que deseja excluir?');">
          <i class="bi bi-trash"></i> Excluir
        </a>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Lista de Utilizadores</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
<div class="container">
  <h1 class="mt-5">Lista de Utilizadores</h1>

  <a href="/usuario/novo" class="btn btn-primary mb-3">Cadastrar Novo Utilizador</a>

  <table class="table table-striped mt-3">
    <thead>
    <tr>
      <th>Código</th>
      <th>Nome</th>
      <th>Email</th>
      <th>Telefone</th>
      <th>Cargo</th>
      <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="usuario : ${usuarios}">
      <td th:text="${usuario.codigo}"></td>
      <td th:text="${usuario.nome}"></td>
      <td th:text="${usuario.email}"></td>
      <td th:text="${usuario.telefone}"></td>
      <td th:text="${usuario.cargo}"></td>
      <td>
        <a th:href="@{/usuario/editar/{id}(id=${usuario.codigo})}" class="btn btn-warning btn-sm me-1">
          <i class="bi bi-pencil-square"></i> Editar
        </a>
        <a th:href="@{/usuario/excluir/{id}(id=${usuario.codigo})}" class="btn btn-danger btn-sm"
           onclick="return confirm('Tem certeza que deseja excluir?');">
          <i class="bi bi-trash"></i> Excluir
        </a>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
